<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LOG-GPS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            /* Background Gradasi Navy Soft, Biru, hingga Orange */
            background: linear-gradient(
                135deg, 
                rgba(15, 23, 42, 0.92) 0%,     /* Navy Soft Gelap Transparan */
                rgba(30, 58, 138, 0.85) 45%,    /* Biru Navy AlamTri */
                rgba(41, 75, 148, 0.8) 75%,     /* Biru Cerah */
                rgba(249, 115, 22, 0.85) 100%   /* Orange Aksen Logo AlamTri */
            );
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-attachment: fixed;
            margin: 0;
            padding: 1.5rem; /* Memberi jarak aman dari pinggir layar HP */
        }
        .card-login {
            width: 100%;
            max-width: 360px; /* Diperkecil dari 420px agar proporsional di HP */
            padding: 1.8rem 1.5rem; /* Padding dalam dibuat lebih ringkas */
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        /* Ukuran Logo di HP disesuaikan sedikit agar pas */
        .card-login img {
            height: 60px !important; 
        }
        .btn-soft-blue {
            background: linear-gradient(135deg, #1b3075 0%, #2f68e3 100%);
            color: white;
            border: none;
            transition: all 0.3s ease;
        }
        .btn-soft-blue:hover {
            background: linear-gradient(135deg, #1E3A8A 0%, #1D4ED8 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
        }
        .form-control:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 0.25rem rgba(56, 189, 248, 0.25);
        }
    </style>
</head>
<body>

    <div class="card-login text-center">
        <!-- Logo AlamTri Geo (Diperbesar ukurannya) -->
        <div class="mb-3">
            <img src="{{ url_for('static', filename='alamtri_login.png') }}" 
                 alt="Logo AlamTri Geo" 
                 style="height: 78px; width: auto; object-fit: contain;" 
                 class="mx-auto d-block">
        </div>

        <h3 class="fw-bold mb-0" style="color: #1e40af;">LOG-GPS</h3>
        <p class="text-muted small mb-4" style="letter-spacing: 0.5px;">LOGISTIC GENERAL PORTAL SYSTEM</p>

        <!-- Pesan Flash -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show text-start small border-0 shadow-sm" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="/login" class="text-start">
            <div class="mb-3">
                <label for="nrp" class="form-label fw-semibold text-secondary small">NRP / NIK</label>
                <input type="text" class="form-control py-2" id="nrp" name="nrp" placeholder="Masukkan NRP Anda" required autofocus>
            </div>
            <div class="mb-3">
                <label for="pin" class="form-label fw-semibold text-secondary small">PIN Akses</label>
                <input type="password" class="form-control py-2" id="pin" name="pin" placeholder="Masukkan 6-digit PIN Akses" required>
            </div>
            <button type="submit" class="btn btn-soft-blue w-100 py-2.5 fw-semibold mt-2 rounded-3">MASUK PORTAL</button>
        </form>
        
        <div class="text-center mt-4 text-muted small" style="font-size: 0.78rem;">
            &copy; 2026 LOG-GPS &bull; Logistic Support
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
